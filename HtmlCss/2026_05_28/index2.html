<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        input[placeholder="Your name"]{
            color: red;
        }
        input[type="email"]{
            border-color: brown;
        }
        /*starts with (^) */
        a[href^= "https"]{
            color: green;
        }
        /*ends with ($)*/

        a[href$=".com"]{
            text-decoration: line-through;
        }
        /*containes (*)*/
        li[data-level*="beginner"]{
            background: aquamarine;
        }
    </style>
</head>
<body>
    <section id="attribute-selectors">
        <h2>attribute-selectors</h2>
        <a href="https://asdasdsa.com">External Link</a>
        <a href="/about">Internal About Page</a>
        <a href="mailto: hello@gmail.com">Email</a>
        <input type="text" placeholder="Your name">
        <input type="email" placeholder="Your email">
        <input type="password" placeholder="Your password">
        <ul>
            <li data-level="beginner">Html</li>
            <li data-level="intermediate">Css</li>
            <li data-level="advanced">JS</li>
        </ul>
    </section>
</body>
</html>

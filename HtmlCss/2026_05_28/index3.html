<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .hover-btn{
            background: red;
            border-radius: 2px;
        }
        .hover-btn:hover{
            background-color: #007bff;
            color: white;
            border: none;
            padding: 8px 16px;
        }

        .menu li:first-child{
            font-weight: bolder;
        }
        .striped-list li:nth-child(even){
            background: pink;
            
        }
        .striped-list li:nth-child(odd){
            background: lightgray;
        }
        .striped-list li:nth-child(3n){
            background: blueviolet;
        }
        
    </style>
</head>
<body>
    <section>
        <h3>Pseudo classes</h3>
        <button class="hover-btn">Hover Me</button>
        <ul class="menu">
            <li>Home</li>
            <li>About</li>
            <li>Services</li>
            <li>Contact</li>
        </ul>
        <ul class="striped-list">
            <li>Row  1</li>
            <li>Row  2</li>
            <li>Row  3</li>
            <li>Row  4</li>
            <li>Row  5</li>
            <li>Row  6</li>
            <li>Row  7</li>
            <li>Row  8</li>
            <li>Row  9</li>
            <li>Row 10</li>
        </ul>
    </section>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selectors</title>
    <style>
        *{
            font-family: sans-serif;
        }
        p{
            color: aqua;
        }
        button{
            /* 6px is for top and buttom ; 16 px is for left and right */
            padding: 6px 16px;
            border-radius: 4px;
        }
        .primary-button{
            background: blue;
            color: #000;
        }
    </style>
</head>
<body>
    <section>
        <h2>Hello World</h2>
        <p>Lorem ipsum dolor sit amet consectetur, adipisicing elit. Commodi officiis explicabo, assumenda est ex veniam enim quas magnam modi consequuntur, voluptates ab libero eos adipisci eligendi nisi aspernatur totam praesentium.</p>
        <p class="highlight">highlighted elemennts</p>
        <button>Click Me</button>
        <button class="primary-button">Click Me</button>
        
    </section>
</body>
</html>

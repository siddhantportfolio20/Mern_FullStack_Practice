<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>forms </title>
</head>
<body>
    <form name="myForm" id="my-form">
        <input type="text" name="name" placeholder="Enter your Name">
        <br>
        <input type="text" name="address" id="addressInput" placeholder="Enter your address">
        <br>
        <input type="number" name="age" placeholder="Enter your Age" >
        <br>
        <textarea name="userinfo" id="" placeholder="Enter user Info"></textarea>
        <br>
        <button type="submit" id="submitBtn">Submit</button>
    </form>

    <table>
        <thead>

            <tr>
                <th>Name</th>
                <th>Address</th>
                <th>age</th>
                <th>userinfo</th>
            </tr>
        </thead>
        <tbody>

        </tbody>
    </table>

    <script src="forms.js"></script>
</body>
</html>
